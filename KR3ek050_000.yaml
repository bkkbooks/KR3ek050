body:
  text: 編序夫世有病腹痛者諸藥無驗遂為痼疾連綿常苦不知其由也豫嘗用心考究之外臺有石疝盤疝等説要略有寒疝之論就閲之今之腹痛多其症也余因此治之而得效甚多矣實似得其術然猶未為得也何則痛愈後經百日或越一年有復發者然則不可謂絶根竭源之法也彼積聚之症病根難斷世醫或欲以下劑斷之非其治也今餘論疝亦類之雖非可果斷者然若果不治則何一治乎能一治則不可無治是未得其真故爾然欲一治之亦不可得其法則難治假令再發復以其法則足凌痛楚矣有用古方不治者余新制方施之屢得效矣徭此終身不發者不鮮也今編集其論其方得奇效者以為一卷至使其病果不再發之治者俟後之良工耳安永七戊戍春三月張州海西大橋尚因著疝作諸症説大凡治病先當正其名不正其名者猶緣木而求魚也病欲治之者先當論其因正其名蓋有積聚癥瘕腹痛諸症歷數年不愈者吾能見之疝病十居八九然人不知而治之何得愈矣蓋不正其名不論其因故也疝之諸症雖古人所言許多然心腹痞硬如盤或如袋盛瓜或痛或不痛經數年而不愈者心下痞硬而嘔吐清水或年年吐食似反胃者或小腹微疼瀉利不止其病綿連者小便淋瀝陰莖痛而出膿血者腰腳麻痹或腳弱走痛難久立者腹中不和懶言語動作身體羸瘦不欲飲食五心煩熱似虛勞者或腹中卒如鼓脹昏倒四肢逆冷欲死者或惡寒發熱舌上有白胎不入穀食四肢拘攣者午後發熱蒸蒸汗如流上逆目眩者或遊走胸背或暴嘔吐或卒惡寒戰栗咬牙頃刻而止者或痛甚而為角弓反張者或腰足痿不動者此等諸症皆疝之所為而古人所不言也至如此者世醫不知何病猥與藥或中脘久痛則曰脾胃虛胸膈痛則曰痰腰卒痛則曰風濕相搏雖偶知之藥非其藥以此疾愈盛連年不愈遂為不治而服餌都廢束手俟死者甚多矣夫疝者陰病而發動者也其主則肝腎也其患先起於肝而入腎遂成二臟病其主二臟而先謂肝者何也肝易動難靜嬰兒無心亦動者惟肝而已矣故肝者寒濕易侵易客也而非無依熱者雖然其熱非溫柔之陽氣故寒又易客也雖元屬熱極則為寒是其常也傷寒硝黃之症亦有久而用薑附者諸積久而為疝則其寒不可全無也其諸積變為疝何也肝急速而能動矣故走而接之遂為已病腎膀胱小腸為之所迫自病則盤腸氣等症起焉肝以他之病者譬如俠客之救他之鬥以他之敵為已之敵也疝之為諸症肝惟動故所畜之寒冷結氣橫行腹中衝上至心下則痞硬嘔吐下降至小腹則疼痛泄痢矣塞氣則如勞瘵塞膀胱則為淋瀝肝主筋故攣急或筋縮屈伸不便又其肝腎二脈病則為麻木痿弱等症外以經脈謂則起於足大指交出大陰後循股入陰中抵小腹屬肝絡膽上貫膈布脅肋連目繫上出額與督脈會於巔是肝之所循也腎又起於小指之下循內踝之後別入跟中出膕內廉上股內貫脊屬腎絡膀胱其直者從腎上貫肝上膈入肺中循喉嚨如此其經從足至頭則其元雖在腰腹而腳腨項背之病爭起可知也疝之所成惟寒而已也故非烏附以敗症散寒梔子以行結氣則難治矣世人偏用木香檳榔烏藥香附青皮枳殼等不問寒熱新久一例施之彼檳烏之輩何足敗症散寒是以纍年不愈者盲惑衆盲故也醫者豈可不選哉漢高得三傑而興矣蜀主得孔明而安矣凡患疝者得以烏附治者應自安矣唯有麻木攣急五心煩熱等證則他病而何謂之疝果見有疝之所為而後可以疝治之故以診疝之法別書之診疝法諸積各有部位惟於其疝也雖無有定位然多皆繞臍動氣腸間奔鳴惟似蛙鳴者也或自岐骨至橫骨如建竿或自胸下至小腹大筋一條相貫者或臍傍一塊奔突鉤痛者或其元在臍而胸脅苦滿心下痞硬者或睪丸連小腹急痛者或結聚臍腹則腰痛上衝胸脅則徹背痛或腹痛則腳攣急及轉筋此等諸狀非有常者朝見此症夕見彼症者也是此諸症皆疝之候也雖無顯然其形而必有動者有鳴者皆此疝也其元如此而雖有似痿痹及反宵者為疝無疑諸疝水疝囊腫如水晶或囊癢而流黃水陰汗自出小腹按之作水聲筋疝陰莖腫脹或挺長不收或痛癢狐疝狀如仰瓦臥則入小腹如狐畫出穴而溺夜入穴而不溺尸疝心腹厥逆不得氣息痛達背膂石疝心下堅痛不可手近塞疝臍下堅痛得寒冷食輒劇或繞臍痛若發則自汗手足厥冷或腹中痛及脅痛裡急或身痛手足不仁盤疝脅下堅痛大如手時出見若不見脈疝小腹脹滿引膀胱急痛氣疝上連腎俞下及陰囊或難於前後溲而溺赤病見寒氣則遺溺使人腹脹牡疝在臍下上連肺血疝臍下結痛女人月事不時或如黃瓜在小腹兩傍矣豫按李挺曰如黃瓜在小腹兩傍俗曰便毒瘡家之一病而與疝不同便毒不日而膿潰或又其部位不限腿胯小腹間其症雖不速膿潰然非無膿潰者雖非無其潰與便毒之潰不同治方又不同便毒之未膿潰者與下劑則輒愈至血疝之症者難以下劑治與疝之以諸劑自愈者甚易辨何混而謂之乎然其書之意令人易知耳為易知則可也謂俗曰便毒者而實非便毒則豈如斯書之説乎如斯書之説則雅名血疝而俗名便毒也便毒與血疝二病元不同李子之言不分明矣盤腸氣腸中奔氣作聲成痛膀胱氣小腹陰囊手按作聲而痛小腸氣小腹臍傍一硬塊升上鉤痛腎氣小腹下注上奔心腹急痛腸㿗外腎偏墜腫癢或痛印㿗玉莖腫硬引臍絞痛甚則陰縮肢冷囊上生瘡氣㿗素有濕熟因怒激起相火昏眩手搐如狂水㿗外腎腫大如斗如升或不痛不癢木腎睪丸腫痛或堅硬頑痹不痛偏墜陰子偏大偏小也㿗疝在婦人則為陰戶突出諸積肝積名曰肥氣在左脅下如覆杯有頭足心積名曰伏梁起臍上大如臂上至心下脾積名曰痞氣在胃脘覆大如盤肺之積名曰息賁在右脅下覆大如杯腎之積名曰奔豚發於小腹上至心下若豚狀或上或下無時矣豫按八門曰有積聚成塊不能移動者曰症言堅硬頑固也或上或下或右或左者曰症然則積之甚者謂症其移動者謂瘕與積聚無異如鱉症鱉瘕以其形名者也豈依吃鱉邪如米瘕豈因吃米哉凡有積聚癥瘕者其臟腑必不平故偏好一物耳世病積者有好吃果實有好吃蔬菜以米症等説名之則可稱果實症蔬菜症是不因吃米可知也如應聲症腹中雖為人語然吾未見之古人謂之則雖非決無然不知其真故不論此又諸癥瘕與積同類故不論列丁未之春豫右足大指痛物觸之痛甚強踏亦難忍擇方服之無驗以藥貼之以藥湯熏洗之猶無寸效矣自謂緩風濕痹等症將發乎然用治風痹方無驗則非其病可知也一日疝上充塞心下疼痛劇矣即服桂枝加附子湯二貼而腹痛止指痛亦去矣後歷數月復發治之如初而指痛忽止於是全愈始知疝之患亦及四末益以疝方治其病故記載以為後助矣一婦人吐食甚衆醫皆以為翻胃身體羸瘦起居轉難十有五年猶未治諸醫俱束手豫診脈以為寒疝根在臍腹大如覆杯此痛令人吐者也是衆醫所過也與家制半夏湯五貼便止止而又下痢蓋寒邪逐水飲上奔則吐也下行則下利今也實下行矣宜先治瀉因與家制苓朮羌附湯瀉果止矣而後以古梔附湯攻病源不過五七劑而全愈病婦曰百年之患為君失矣傍人又曰起虢之妙也同袍牧子圭過豫曰吾母病心腹痞滿疼痛不飲食日吐水數升骨立倦怠也他醫為留飲治之無驗其年七十餘一以喜其壽一以懼此病吾子願治之豫往診其脈告曰塞疝也病得之寒矣病母曰君之言是也吾一日嚴冬冒風忽為惡寒無幾此病發豫曰一朝之邪何至此乎是元有疝外感之邪相促以使然也即為之作茯苓湯飲之藥入腹吐即定又奧桂枝加附子湯平其疝而病方已子圭又來曰曩阿母疾病矣藥治無驗焉僕不勝其憂足下為吾惠藥以起其廢深荷大德何日忘之一男子有患天行病者惡寒發熱頭痛煩躁譫語豫治之而病頗愈雖然猶未了了腹或微疼飲食不進間又發熱頭痛餘邪似未盡燃無有邪脈將是勞復乎用其方無驗用諸調理之劑無有寸效再診之心下有所結聚按之暗然有冷氣時鳴動矣是果寒疝也嗚呼過矣諸所為非其洽參耆雖尊非其症何得其效遂轉方治其疝五七貼而頗安繼與之諸症豁然其方則桂枝加附子湯也森村生晚秋患痢疾甚而口燥溺澀下痢晝夜二百餘行裡急後重腹硬滿疼痛不欲飲食豫以承氣湯等下之病漸已雖然惟精神未復飲食未進起居勞倦矣自以為其脈代也疲甚矣恐關性命邪傍人又曰攻擊之弊遂成之邪即迎豫令診脈豫曰經曰脈去來時一止無常數名曰結無常數與臟腑虧損之代不同是結脈也結是積也應有積便診腹則果宥矣按之為蛙鳴是疝也與襯腎湯病已脈又平也一男子嚴冬之日卒惡寒戰栗手足逆冷近火惡寒不止半日漸退而心腹脹滿疼痛腰腳攣急下利不食舌上白黃胎衆醫皆以為卒中寒豫診脈曰寒疝也補腎湯加附子與一劑病頗緩繼與之諸症豁然此病豈卒中寒為之舊冷相積以使然也所以知其病者其脈緊而結緊寒也結積也腹鳴似蛙鳴是余所以為疝也一老翁手臂疼痛自以為痰豫診脈曰疝也他日心腹痞硬或腹中應拘急翁曰然豫曰臂與腹其本同矣與桂枝加附子湯病已一男子患腰痛三十日不能起藥餌針灸皆無驗一日迎豫請治診其脈滑而急豫曰是積之脈也非有積邪病者曰無有矣豫曰如疝痛則雖其形不顯然或引睪丸或臍邊有動氣或為腹中雷鳴耳病者曰然雖無引睪丸等症時雷鳴或以積在腰下豫曰果疝也疝伏而不顯反著腰以令痛與補腎湯其病尋已豫曩客蓬北有人過豫之旅館曰吾久患下利衆醫皆以為脾胃虛治之數年而無愈願晉治之豫診脈曰脈無虛候豈為脾胃虛乎若果虛則數年之病形體何不衰乎其人小腹有塊雷鳴豫曰是寒疝也吾能可治之即製劑與之果驗其方家制苓朮羌附湯是也有人患心痛三年百藥無有驗豫診之曰石疝也痛甚故痛及心也痛者殆虛不可攻擊以建中湯養中焦加附子以和疝繼與蒼朮湯和心下不過十貼全已一婦人病衆醫為鼓脹治之無效豫診其脈曰疝之濕症也先與三白湯下如豆汁者數升脹頗愈繼與桂枝加附子湯全愈所以知其病者鼓脹則無消長今病緩則消焉盛則脹焉時腹鳴響是所以為疝也松山生者患淋疾十餘年焉一日大發莖中疼痛小便膿血小腹有塊牽引脅下豫診之曰盤腸氣也便血雖似血淋有塊痛者難為血淋設使為血淋亦當利腸氣即作四味茴香散與之卒痛止血淋全愈一男子腹中達臍有塊為鳴動一日卒得腰腳痿弱不能動豫診其脈曰寒疝也此病寒邪客肝腎二藏令然其經亦為寒邪所關故為此症耳非烏頭以治疝附子以行經不可治即與烏頭煎一劑瞑眩甚矣病夫曰藥增苦楚不堪服豫曰是將愈之候也藥不瞑眩其病不瘳是也曲喻之強服之病略愈再與梔附湯加味豁然一婦人有病接豫診其脈疝症也與大黃附子細辛湯下其寒再與桂枝加附子湯病已豫未往診時以五心煩熱心氣不樂羸瘦倦怠衆醫為虛勞豫獨以為疝症何者心下顯然有塊按之有冷氣而為鳴動也勞症之邪在脾者或雖似之然勞之痞塊何有鳴動冷氣乎疝亦從七情起則心熱不樂亦疝之候也此人果勞則治勞之劑何不效乎吾以為疝不亦宜乎一老翁小腹痛腹鳴血痢日數十行自以為痢尢甚者也豫診之曰疝也夫疝病屬肝肝藏血正邪相搏傷其血故下血也邪傷血而利則可與血利同治雖然是病元自疝來不治其本不可也即與補腎湯病愈一婦人患心痛五年諸藥針灸無有效豫診脈曰心下痞硬正是積也然非五積部位雖殆如盤疝然其位高則難為盤疝極知疝客心脾邪正相爭奔騰故上衝心下而痛也先與桂枝加附子湯和其疝疝和而後以手法拈散餘邪心脾痛全已一男子常苦疝症一日大發腹硬滿疼痛豫診之其脈沉緊而伏傍人皆為死症豫曰積聚癥瘕之病不致卒死何足恐哉即與神保丸十五丸藥下咽病卒已寒疝主方桂枝加附子湯治塞疝心腹疼痛手足逆冷身體拘急方桂枝巧藥附子各六分甘草大棗生薑各三分水煎服補腎湯家方治寒疝肚腹疼痛紲瀉胸滿痞塞或虛火上攻舌胎不食方附子人參白朮茯苓黃耆木瓜各五分羌活乾薑沉香各三分紫蘇川穹甘草各二分右水煎服苓朮羌附湯家方治寒疝小腹疼痛泄瀉不止甚則交血利者方茯苓白朮羌活附於甘草大棗右水煎甘草乾薑湯家方治諸疝泄利者方甘草乾薑各五分蜀椒附子各三分右水煎茯苓湯家方治諸疝嘔吐不止飲食不納方茯苓五分陳皮附子白朮各二分牛夏吳茱萸各一分水煎臨服入薑汁一匙溫服生薑半夏湯家方治同前方生薑六分半夏吳茱萸附子各三分右水煎薑椒湯外臺方治胸中疝積嘔吐飲食不納方半夏茯苓各三分桔梗陳皮各二分桂枝附子蜀椒甘草各一分右水煎臨服入薑汁一匙溫服烏椒湯治心胃時痛時止經年月不止烏頭蜀椒各六分乾薑桂枝各四分大棗一枚右水煎服半夏乾薑湯治心胃痛不可忍方乾薑桂枝半夏蒼朮生薑各等分右水煎服蒼朮湯治諸疝心痛時痛時止久不已蒼朮八分藁本五分右水煎溫服十味蒼柏散治諸疝肚腹疼痛方蒼朮黃柏香附各七分青皮玄胡益知桃仁各五分茴香附子甘草各三分右水煎溫服古梔附湯治寒疝入心腹卒痛及小腸膀胱氣㽱剌脾腎氣攻攣急極痛難忍腹中冷重如石自汗不止等方梔子附子等分右水一盞酒半盞鹽一撮入煎服即方也烏頭千金方治諸疝腹痛方乾薑八分桂枝六分芍藥四分烏頭甘草大棗各二分右水煎溫服蜀椒湯外臺方治塞疝心腹如刺繞臍腹中盡痛者方蜀椒乾薑附子半夏甘草粳米大棗水煎服茯令桂甘湯傷寒方治疝作奔豚方茯苓八分桂枝甘草各四分生薑少許水煎服四味茴香散治疝作淋瀝囊莖抽痛方烏藥良薑青皮茴香等分右為細末溫酒調服三白湯家方治疝作腹脹滿方白醜三分桑白皮白朮木遍陳皮茯苓各五分大棗一枚右水煎臨服入薑汁一匙溫服厚朴七物湯要咯方治疝腹痛甚而為脹滿者厚朴八分甘草四分大黃三分大棗枳實桂枝生薑各二分右水煎服大黃附子湯要咯方治疝腹脹滿痛甚欲絶者以此方不為下利者不治大黃附子各六分細辛四分右水煎溫服心疝湯治繞臍痛上支脅心下大痛方芍藥蜀椒桔梗細辛桂枝乾薑各六分附子二分右蜜少入水煎溫服良薑湯家方治諸疝心腹絞痛加刺兩脅支滿煩悶不可忍方良薑五分當歸桂枝各二分厚朴附子各二分右水煎溫服薑桂湯家方治寒疝心胃痛不可忍方乾薑桂枝蒼朮半夏附子生薑各等分右水煎溫服飢疝湯治飢則心胃痛得食則痛止者方龍膽附子黃連各等分右水煎溫服奔豚湯治寒疝手足厥冷上氣腹滿絞痛欲絶方生薑九分半夏桂枝吳茱萸人參甘草各二分右水煎溫服硫荔丸活塞疝上衝塞心臟痛甚手足厥冷欲死者方荔枝核陳皮硫黃各等分右為細末以飯為丸梧子大每十四丸溫酒送下手拈散治疝塞心下痛甚方玄胡沒藥甘草五靈脂各等分為細末每服三錢溫酒送下當歸茴香散家方治塞疝小腹痛方當歸茴香附子良薑各等分右水煎溫服神保丸治諸積氣痛項背注痛宣通臟腑之方全竭七個巴霜十個木香胡椒各五分右為末蒸餅丸麻子大硃砂為衣每五七丸用烏頭煎方治暴疝閉塞諸方不應者烏頭二錢水一盞蜜半盞煎一盞取川抵當烏頭桂枝湯治暴疝腹痛逆冷手足不仁若身痛灸剌諸藥不能治方方要略見寒疝下積衆治方論人有五積六聚有疝有症有瘕同腹中有形之病而異名者甚多矣是何因而得之積聚者宿食痰瘀血以成塊者也癥瘕者臟腑虛弱飲食不消化而結聚也疝者濕熱凝滯於肝經令然也是皆古人之論而非無是理然痰瘀血宿食則利下可以治巳利下而不愈則似難為痰瘀食豫按是皆一氣凝滯結聚而令然也故難經曰氣之所聚名曰聚氣之所積名曰積是之謂也故氣之所不平者則邪之所以相集也雖言相集然積聚之地其邪相依託而巳非其物成病故氣不和則雖攻其塊不消見其不消者為痰瘀食治則至害人命故恬淡虛無而理心者無有此患焉故飲酒人有積者少矣其氣不凝滯故也是以虛女不出閨門者而患積聚則百藥不治嫁則自消和矣其氣舒故也是其相集者標而其氣為本可知也不治本而治標非真治也故節思慮養性情者何積之有然頑愚婦女輩何以行之故酒以忘憂或假絲竹以蕩之如此而不愈者藥不可不以治之欲治之者以術苓半夏厚朴生薑枳殼橘皮木香檳榔等藥下氣行氣解胸腹痞塞鬱氣結聚或有熱者和解之甚者小通利之痰食托之為害則消化之劑並治之自愈也又疝之症有久而吐瀉者惟此症與諸積不同客寒內沉故邪正爭而使吐下也其吐水者以術苓生薑吐食者以附吳半夏下利者以羌附術苓腹痛者桂甘芍附或寒客之深者以溫下之藥少下之則病雖深痼無不治矣五積之症猥以峻下之劑則反至生他變世醫往往有用下劑者真救縊而引其足也可不戒哉惟女人血塊雖可攻之然有氣和自消者則不攻亦可也諸積雖行氣之劑可以治一憂一慮復正發如初也故欲斷病本先斷思慮可也使之能節思慮者非醫之所能其不能節者無如之何藥説病有寒熱藥有溫冷非寒病多而熱病少又非熱病多而寒病少故周而不比不可不節溫冷然而溫冷之藥以何為主是各有其功優劣難分然非無優者參附薑桂硝黃苓連是優者也以此物為勝何也百病不能離寒熱之二焉寒熱二病不能離此藥此餘雖有溫冷之藥以此諸藥為最也故特為尊之而已為治者宜分此二品然此症亦有難分者表熱裡寒潮熱之症反宜溫藥也裡熱表寒四肢厥冷之症反宜寒藥也內傷夾外邪壯熱者有宜溫藥者非徒是諸藥雖間有達矢非忽告變者只此八味之藥最難使焉若可與薑附者反以硝黃則其害不少也以一匕之藥害人之性命為醫者不可不慎然恐其猛者而徒用其劣者則無有驗然古今醫人治方有各不周者或有偏寒者或有偏熱者如斯則一寒一熱不得無過故分八物之牲寒溫不偏而能治之可謂良工君子醫其偏者為下工小人醫凡行醫者無為小人之醫每臨百病以八品之藥為主加之以溫涼之良藥五六品出入能用之則其病無不愈而自達治虢之妙境耳跋海西橋氏為世良醫以其居邊徼人不之知也已少時入京受業於駒御醫既還病者麇至今年七秩其間所治藥者不知幾千萬也最用心於疝瘕一症奏效最捷其法其方世醫所不企及也余曾聞諸門人玄節爾橘生一日來謁於余曰業生來用工夫於疝瘕一症似粗有所得者可謂愚者一得也唯恐其法其方蕪沒於後世而無有識者也因著疝症積聚編一卷方將梓之以傳播人間願先生賜一言以嚆矢之餘取讀之文字雖固陋而似有所見者也因語之曰余觀近世方書猶歉歲之玉雖美於目無益於飢也如吾子斯書猶豐年之谷雖為人所賤而不可一日無之耳果使其方有益於世邪何問文字之工拙哉吾子欲梓之餘何惜一言遂題其後還之
